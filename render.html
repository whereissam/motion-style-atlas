<script>
  const cv = document.getElementById('c');
  window.fontsLoaded = (async () => {
    await Promise.all(MG._fontLinks);
    const specs = [];
    Object.values(MG.films).forEach(f => (f.fonts || []).forEach(x => specs.push(Array.isArray(x) ? x : [x, 'Aa1'])));
    await Promise.all(specs.map(([s, g]) => document.fonts.load(s, g).catch(() => {})));
    await document.fonts.ready;
    return [...document.fonts].filter(f => f.status === 'loaded').length;
  })();
  window.drawFrame = (id, t, q = 0.94) => { MG.frame(id, t, cv); return cv.toDataURL('image/jpeg', q); };
  window.renderWav = async id => {
    const bytes = await MG.audio(id);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
</script>
